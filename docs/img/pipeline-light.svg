<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="t d"><title id="t">photoface analysis pipeline</title><desc id="d">Scan folder, detect faces with YuNet, embed with SFace, greedy online clustering, average-linkage reclustering, pinned corrections preserved, stored in SQLite. Everything runs locally.</desc><rect width="1280" height="700" fill="#ffffff"/><text x="40" y="52" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#1f2328">How photoface analyzes a folder</text><rect x="20" y="84" width="1240" height="566" rx="18" fill="none" stroke="#1a7f37" stroke-width="2" stroke-dasharray="10 7"/><text x="44" y="122" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing="1.5" fill="#1a7f37">EVERYTHING BELOW RUNS ON YOUR MACHINE</text><rect x="65" y="160" width="250" height="200" rx="14" fill="#f4f5f7" stroke="#c9ccd3" stroke-width="1"/><circle cx="93" cy="190" r="15" fill="#2f5fd6"/><text x="93" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">1</text><text x="117" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Scan</text><text x="83" y="228" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#2f5fd6">analyzer.py</text><text x="83" y="264" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Walk the folder recursively</text><text x="83" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Skip unchanged (mtime + size)</text><text x="83" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Read EXIF date/GPS, dHash</text><rect x="365" y="160" width="250" height="200" rx="14" fill="#f4f5f7" stroke="#c9ccd3" stroke-width="1"/><circle cx="393" cy="190" r="15" fill="#2f5fd6"/><text x="393" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">2</text><text x="417" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Detect</text><text x="383" y="228" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#2f5fd6">YuNet</text><text x="383" y="264" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">cv2.FaceDetectorYN</text><text x="383" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Runs on a copy up to 1600 px</text><text x="383" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Boxes scaled back to full size</text><rect x="665" y="160" width="250" height="200" rx="14" fill="#f4f5f7" stroke="#c9ccd3" stroke-width="1"/><circle cx="693" cy="190" r="15" fill="#2f5fd6"/><text x="693" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">3</text><text x="717" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Embed</text><text x="683" y="228" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#2f5fd6">SFace</text><text x="683" y="264" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">cv2.FaceRecognizerSF</text><text x="683" y="290" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Align + crop each face</text><text x="683" y="316" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">One 128-d vector per face</text><rect x="965" y="160" width="250" height="200" rx="14" fill="#f4f5f7" stroke="#c9ccd3" stroke-width="1"/><circle cx="993" cy="190" r="15" fill="#2f5fd6"/><text x="993" y="196" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">4</text><text x="1017" y="196" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Greedy online</text><text x="1017" y="218" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">clustering</text><text x="983" y="250" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#2f5fd6">clustering.py</text><text x="983" y="286" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Cosine sim. to each person's</text><text x="983" y="312" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">mean (unit vectors): join</text><text x="983" y="338" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">if &gt; 0.363, else new person</text><line x1="319" y1="260.0" x2="361" y2="260.0" stroke="#57606a" stroke-width="2.5"/><polygon fill="#57606a" points="361,260.0 350,253.0 350,267.0"/><line x1="619" y1="260.0" x2="661" y2="260.0" stroke="#57606a" stroke-width="2.5"/><polygon fill="#57606a" points="661,260.0 650,253.0 650,267.0"/><line x1="919" y1="260.0" x2="961" y2="260.0" stroke="#57606a" stroke-width="2.5"/><polygon fill="#57606a" points="961,260.0 950,253.0 950,267.0"/><rect x="965" y="420" width="250" height="200" rx="14" fill="#f4f5f7" stroke="#c9ccd3" stroke-width="1"/><circle cx="993" cy="450" r="15" fill="#2f5fd6"/><text x="993" y="456" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">5</text><text x="1017" y="456" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Average-linkage</text><text x="1017" y="478" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">recluster</text><text x="983" y="510" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#2f5fd6">clustering.py</text><text x="983" y="546" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Re-cluster every face together</text><text x="983" y="572" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Merge while avg. sim. &gt;= t</text><text x="983" y="598" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">One transaction, ids stay stable</text><rect x="665" y="420" width="250" height="200" rx="14" fill="#f4f5f7" stroke="#b35309" stroke-width="2"/><circle cx="693" cy="450" r="15" fill="#b35309"/><text x="693" y="456" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">6</text><text x="717" y="456" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">Pinned corrections</text><text x="717" y="478" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">preserved</text><text x="683" y="510" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#b35309">clustering.py</text><text x="683" y="546" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Hand-edited faces are anchors</text><text x="683" y="572" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Never moved by reclustering</text><text x="683" y="598" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Two pinned people never merge</text><rect x="365" y="420" width="250" height="200" rx="14" fill="#f4f5f7" stroke="#c9ccd3" stroke-width="1"/><circle cx="393" cy="450" r="15" fill="#2f5fd6"/><text x="393" y="456" text-anchor="middle" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#ffffff">7</text><text x="417" y="456" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#1f2328">SQLite</text><text x="383" y="488" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="13" fill="#2f5fd6">database.py</text><text x="383" y="524" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">photoface.db on your disk</text><text x="383" y="550" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">photos, persons, faces, tags</text><text x="383" y="576" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#57606a">Embeddings stored as float32</text><line x1="1090.0" y1="364" x2="1090.0" y2="416" stroke="#57606a" stroke-width="2.5"/><polygon fill="#57606a" points="1090.0,416 1083.0,405 1097.0,405"/><line x1="961" y1="520.0" x2="919" y2="520.0" stroke="#57606a" stroke-width="2.5"/><polygon fill="#57606a" points="919,520.0 930,513.0 930,527.0"/><line x1="661" y1="520.0" x2="619" y2="520.0" stroke="#57606a" stroke-width="2.5"/><polygon fill="#57606a" points="619,520.0 630,513.0 630,527.0"/><rect x="65" y="420" width="250" height="200" rx="14" fill="none" stroke="#1a7f37" stroke-width="1.5"/><text x="83" y="456" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" font-weight="700" fill="#1a7f37">Private by design</text><text x="83" y="488" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#57606a">Photos, embeddings and the</text><text x="83" y="512" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#57606a">database stay on this disk.</text><text x="83" y="536" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#57606a">No photoface server exists.</text><text x="83" y="560" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#57606a">Only network use: the one-</text><text x="83" y="584" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" fill="#57606a">time model download.</text><text x="40" y="680" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" fill="#57606a">Read from analyzer.py, clustering.py and database.py. t = similarity threshold (default 0.363, adjustable in Settings).</text></svg>
