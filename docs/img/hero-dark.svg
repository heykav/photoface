<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="t d"><title id="t">photoface</title><desc id="d">photoface: a terminal-style banner. Six faceless avatar tokens, an illustration with no real people, regroup into three people. Tagline: find the people in your photo library, without uploading a single photo.</desc><rect width="1280" height="440" fill="#090A09"/><style>.t0{animation:m0 9s ease-in-out infinite}@keyframes m0{0%,58%{transform:translate(0,0)}66%,78%{transform:translate(236px,134px)}90%,100%{transform:translate(0,0)}}.t1{animation:m1 9s ease-in-out infinite}@keyframes m1{0%,58%{transform:translate(0,0)}66%,78%{transform:translate(0px,-134px)}90%,100%{transform:translate(0,0)}}.t2{animation:m2 9s ease-in-out infinite}@keyframes m2{0%,58%{transform:translate(0,0)}66%,78%{transform:translate(0px,134px)}90%,100%{transform:translate(0,0)}}.t3{animation:m3 9s ease-in-out infinite}@keyframes m3{0%,58%{transform:translate(0,0)}66%,78%{transform:translate(118px,-134px)}90%,100%{transform:translate(0,0)}}.t4{animation:m4 9s ease-in-out infinite}@keyframes m4{0%,58%{transform:translate(0,0)}66%,78%{transform:translate(-236px,134px)}90%,100%{transform:translate(0,0)}}.t5{animation:m5 9s ease-in-out infinite}@keyframes m5{0%,58%{transform:translate(0,0)}66%,78%{transform:translate(-118px,-134px)}90%,100%{transform:translate(0,0)}}.cur{animation:bl 1.2s steps(1) infinite}@keyframes bl{50%{opacity:0}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="24" y="24" width="1232" height="392" rx="12" fill="#0E100E" stroke="#1F231F"/><path d="M24 64H1256" stroke="#1F231F"/><circle cx="46" cy="44" r="5.5" fill="#FF6B5E"/><circle cx="66" cy="44" r="5.5" fill="#B6FF2E"/><circle cx="86" cy="44" r="5.5" fill="#00FF66"/><text x="640.0" y="49" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#8A918A">photoface ~ analyze ./photos</text><text x="72" y="118" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#00FF66">$ photoface analyze ./photos</text><rect class="cur" x="320" y="105" width="9" height="16" fill="#00FF66"/><text x="72" y="204" font-family="Georgia, 'DejaVu Serif', serif" font-size="78" font-weight="700" fill="#E9ECE6">photoface</text><text x="74" y="256" font-family="Georgia, 'DejaVu Serif', serif" font-size="28" fill="#E9ECE6">Find the people in your photo library.</text><text x="74" y="296" font-family="Georgia, 'DejaVu Serif', serif" font-size="28" font-style="italic" fill="#00FF66">Without uploading a single photo.</text><text x="74" y="350" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#8A918A">PySide6 desktop app | YuNet + SFace | SQLite | runs locally</text><text x="74" y="372" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#8A918A">Illustration: synthetic avatar tokens, not real people.</text><g class="t0"><rect x="760" y="112" width="96" height="116" rx="12" fill="#151815" stroke="#1F231F"/><path d="M773.44 227 A34.56 34.8 0 0 1 842.56 227 Z" fill="#e96076" opacity=".55"/><circle cx="808.0" cy="153.76" r="19.200000000000003" fill="#e96076"/><rect x="783.8" y="129.56" width="48.400000000000006" height="48.400000000000006" rx="4" fill="none" stroke="#e96076" stroke-width="2.5"/><circle cx="808.0" cy="153.8" r="6.28992" fill="none" stroke="#fff" stroke-width="2.2579200000000004"/></g><g class="t1"><rect x="760" y="246" width="96" height="116" rx="12" fill="#151815" stroke="#1F231F"/><path d="M773.44 361 A34.56 34.8 0 0 1 842.56 361 Z" fill="#e96076" opacity=".55"/><circle cx="808.0" cy="287.76" r="19.200000000000003" fill="#e96076"/><rect x="783.8" y="263.56" width="48.400000000000006" height="48.400000000000006" rx="4" fill="none" stroke="#e96076" stroke-width="2.5"/><circle cx="808.0" cy="287.8" r="6.28992" fill="none" stroke="#fff" stroke-width="2.2579200000000004"/></g><g