<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780" role="img" aria-labelledby="t d"><title id="t">photoface analysis pipeline</title><desc id="d">Scan folder, detect faces with YuNet, embed with SFace, greedy online clustering, average-linkage reclustering, pinned corrections preserved, stored in SQLite. Everything runs locally.</desc><rect width="1280" height="780" fill="#090A09"/><style>.fl{stroke-dasharray:7 6;animation:fl 1.4s linear infinite}@keyframes fl{to{stroke-dashoffset:-13}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="24" y="24" width="1232" height="732" rx="12" fill="#0E100E" stroke="#1F231F"/><path d="M24 64H1256" stroke="#1F231F"/><circle cx="46" cy="44" r="5.5" fill="#FF6B5E"/><circle cx="66" cy="44" r="5.5" fill="#B6FF2E"/><circle cx="86" cy="44" r="5.5" fill="#00FF66"/><text x="640.0" y="49" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12" fill="#8A918A">photoface ~ pipeline</text><g transform="translate(0,44)"><text x="40" y="52" font-family="Georgia, 'DejaVu Serif', serif" font-size="32" font-weight="700" fill="#E9ECE6">How photoface analyzes a folder</text><rect x="20" y="84" width="1240" height="566" rx="18" fill="none" stroke="#00FF66" stroke-width="1.5" stroke-dasharray="10 7" opacity=".7"/><text x="44" y="122" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="15" font-weight="700" letter-spacing="1.5" fill="#00FF66">EVERYTHING BELOW RUNS ON YOUR MACHINE</text><rect x="65" y="160" width="250" height="200" rx="14" fill="#0E100E" stroke="#1F231F" stroke-width="1"/><circle cx="93" cy="190" r="15" fill="#00FF66"/><text x="93" y="196" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#04120A">1</text><text x="117" y="196" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#E9ECE6">Scan</text><text x="83" y="228" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#00FF66">analyzer.py</text><text x="83" y="264" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Walk the folder recursively</text><text x="83" y="290" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Skip unchanged (mtime + size)</text><text x="83" y="316" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Read EXIF date/GPS, dHash</text><rect x="365" y="160" width="250" height="200" rx="14" fill="#0E100E" stroke="#1F231F" stroke-width="1"/><circle cx="393" cy="190" r="15" fill="#00FF66"/><text x="393" y="196" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#04120A">2</text><text x="417" y="196" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#E9ECE6">Detect</text><text x="383" y="228" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#00FF66">YuNet</text><text x="383" y="264" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">cv2.FaceDetectorYN</text><text x="383" y="290" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Runs on a copy up to 1600 px</text><text x="383" y="316" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Boxes scaled back to full size</text><rect x="665" y="160" width="250" height="200" rx="14" fill="#0E100E" stroke="#1F231F" stroke-width="1"/><circle cx="693" cy="190" r="15" fill="#00FF66"/><text x="693" y="196" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#04120A">3</text><text x="717" y="196" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#E9ECE6">Embed</text><text x="683" y="228" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#00FF66">SFace</text><text x="683" y="264" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">cv2.FaceRecognizerSF</text><text x="683" y="290" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Align + crop each face</text><text x="683" y="316" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">One 128-d vector per face</text><rect x="965" y="160" width="250" height="200" rx="14" fill="#0E100E" stroke="#1F231F" stroke-width="1"/><circle cx="993" cy="190" r="15" fill="#00FF66"/><text x="993" y="196" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#04120A">4</text><text x="1017" y="196" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#E9ECE6">Greedy online</text><text x="1017" y="218" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#E9ECE6">clustering</text><text x="983" y="250" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#00FF66">clustering.py</text><text x="983" y="286" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Cosine sim. to each person's</text><text x="983" y="312" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">running mean: join if &gt; 0.363</text><text x="983" y="338" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">else start a new person</text><line x1="319" y1="260.0" x2="361" y2="260.0" stroke="#8A918A" stroke-width="2.5" class="fl"/><polygon fill="#8A918A" points="361,260.0 350,253.0 350,267.0"/><line x1="619" y1="260.0" x2="661" y2="260.0" stroke="#8A918A" stroke-width="2.5" class="fl"/><polygon fill="#8A918A" points="661,260.0 650,253.0 650,267.0"/><line x1="919" y1="260.0" x2="961" y2="260.0" stroke="#8A918A" stroke-width="2.5" class="fl"/><polygon fill="#8A918A" points="961,260.0 950,253.0 950,267.0"/><rect x="965" y="420" width="250" height="200" rx="14" fill="#0E100E" stroke="#1F231F" stroke-width="1"/><circle cx="993" cy="450" r="15" fill="#00FF66"/><text x="993" y="456" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#04120A">5</text><text x="1017" y="456" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#E9ECE6">Average-linkage</text><text x="1017" y="478" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#E9ECE6">recluster</text><text x="983" y="510" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#00FF66">clustering.py</text><text x="983" y="546" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Re-cluster every face together</text><text x="983" y="572" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Merge while avg. sim. &gt;= t</text><text x="983" y="598" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">One transaction, stable ids</text><rect x="665" y="420" width="250" height="200" rx="14" fill="#0E100E" stroke="#F5A524" stroke-width="2"/><circle cx="693" cy="450" r="15" fill="#F5A524"/><text x="693" y="456" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#04120A">6</text><text x="717" y="456" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#E9ECE6">Pinned corrections</text><text x="717" y="478" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#E9ECE6">preserved</text><text x="683" y="510" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#F5A524">clustering.py</text><text x="683" y="546" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Hand-edited faces are anchors</text><text x="683" y="572" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Never moved by reclustering</text><text x="683" y="598" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Two pinned people never merge</text><rect x="365" y="420" width="250" height="200" rx="14" fill="#0E100E" stroke="#1F231F" stroke-width="1"/><circle cx="393" cy="450" r="15" fill="#00FF66"/><text x="393" y="456" text-anchor="middle" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="16" font-weight="700" fill="#04120A">7</text><text x="417" y="456" font-family="Georgia, 'DejaVu Serif', serif" font-size="19" font-weight="700" fill="#E9ECE6">SQLite</text><text x="383" y="488" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#00FF66">database.py</text><text x="383" y="524" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">photoface.db on your disk</text><text x="383" y="550" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">photos, persons, faces, tags</text><text x="383" y="576" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="14" fill="#8A918A">Embeddings stored as float32</text><line x1="1090.0" y1="364" x2="1090.0" y2="416" stroke="#8A918A" stroke-width="2.5" class="fl"/><polygon fill="#8A918A" points="1090.0,416 1083.0,405 1097.0,405"/><line x1="961" y1="520.0" x2="919" y2="520.0" stroke="#8A918A" stroke-width="2.5" class="fl"/><polygon fill="#8A918A" points="919,520.0 930,513.0 930,527.0"/><line x1="661" y1="520.0" x2="619" y2="520.0" stroke="#8A918A" stroke-width="2.5" class="fl"/><polygon fill="#8A918A" points="619,520.0 630,513.0 630,527.0"/><rect x="65" y="420" width="250" height="200" rx="14" fill="none" stroke="#00FF66" stroke-width="1.5"/><text x="83" y="456" font-family="Georgia, 'DejaVu Serif', serif" font-size="20" font-weight="700" fill="#00FF66">Private by design</text><text x="83" y="488" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8A918A">Photos, embeddings and the</text><text x="83" y="512" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8A918A">database stay on this disk.</text><text x="83" y="536" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8A918A">No photoface server exists.</text><text x="83" y="560" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8A918A">Only network use: the one-</text><text x="83" y="584" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="12.5" fill="#8A918A">time model download.</text><text x="40" y="680" font-family="'DejaVu Sans Mono', Menlo, Consolas, monospace" font-size="13" fill="#8A918A">Read from analyzer.py, clustering.py and database.py. t = similarity threshold (default 0.363, adjustable in Settings).</text></g></svg>
