name: build

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            artifact: photoface-macOS
          - os: ubuntu-latest
            artifact: photoface-Linux
          - os: windows-latest
            artifact: photoface-Windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      # Fails closed until the model SHA-256s are pinned in model_files.py:
      # a release must never bundle unverified weights, so no TOFU here.
      - run: python scripts/download_models.py
      - run: pyinstaller photoface.spec --noconfirm

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist
          zip -r ../${{ matrix.artifact }}.zip photoface.app
      - name: Package (Linux/Windows)
        if: matrix.os != 'macos-latest'
        shell: bash
        run: |
          cd dist
          zip -r ../${{ matrix.artifact }}.zip photoface

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # create the draft release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*/*.zip
          draft: true
